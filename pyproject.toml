[project]
name = "icemet-web"
version = "1.2.0"
description = "ICEMET web interface."
authors = [
	{name = "Eero Molkoselkä", email = "eero.molkoselka@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
	"icemet-python>=1.9.0",
	"Flask==3.1.3",
	"Flask-BasicAuth==0.2.0"
]

[project.urls]
repository = "https://github.com/molkoback/icemet-web"

[tool.hatch.build.targets.wheel]
packages = ["icemet_web"]
classifiers=[
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
